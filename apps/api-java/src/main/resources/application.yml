# Honoka Java API 配置（密钥仍放仓库根 .env，由进程环境变量注入，勿写 VITE_）
server:
  # 与根目录 .env 的 API_PORT、前端 VITE_API_PORT 对齐
  port: ${API_PORT:8788}

spring:
  application:
    name: honoka-api-java
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

# 数据目录：相对「启动时的工作目录」。请在 apps/api-java 下执行 mvn spring-boot:run
honoka:
  # 仓库根下的 data/*（与 Node 版共用同一目录）
  uploads-dir: ${HONOKA_UPLOADS_DIR:../../data/uploads}
  samples-dir: ${HONOKA_SAMPLES_DIR:../../data/samples}
  index-dir: ${HONOKA_INDEX_DIR:../../data/index}
  rag-chunk-size: ${HONOKA_RAG_CHUNK_SIZE:500}
  rag-chunk-overlap: ${HONOKA_RAG_CHUNK_OVERLAP:60}
  rag-top-k: ${HONOKA_RAG_TOP_K:4}
  # keyword | vector | hybrid（本地 n-gram 伪向量，见 HybridRetriever）
  rag-mode: ${HONOKA_RAG_MODE:hybrid}
  rag-vector-weight: ${HONOKA_RAG_VECTOR_WEIGHT:0.45}

logging:
  level:
    com.honoka: INFO
